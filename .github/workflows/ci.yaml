name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-static:
    name: Backend Release Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install backend dependencies
        run: make backend-install

      - name: Run backend release checks
        run: make backend-static

  backend-typecheck:
    name: Backend Mypy (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install backend dependencies
        run: make backend-install

      # Advisory until the mypy error count reaches zero — flip continue-on-error
      # to false once the codebase is fully typed.
      - name: Run mypy
        continue-on-error: true
        run: make backend-typecheck

  backend-audit:
    name: Backend Dependency Audit (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install backend dependencies
        run: make backend-install

      # Advisory until known CVEs in indirect deps are addressed — flip
      # continue-on-error to false once pip-audit reports clean.
      - name: Run pip-audit
        continue-on-error: true
        run: make backend-audit

  # Covers what bandit / pip-audit / npm audit cannot: OS packages in the
  # runtime container images, committed secrets, and Dockerfile misconfig.
  # Split into a blocking half and an advisory half on purpose — see the
  # security-gate comment in the Makefile for why the gate is scoped to
  # fixable findings.
  security-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.74.0

      # Blocking. Fixable CRITICALs and leaked secrets are zero today, so this
      # gates from the day it lands rather than "once we get to it".
      - name: Release gate — fixable CRITICAL and secrets
        run: make security-gate

      # Advisory, but *visible*. The 35 HIGH findings on this repo accumulated
      # precisely because npm audit gated at critical and pip-audit sat in a
      # non-blocking target nobody read. Printing them in their own job is the
      # point. Flip continue-on-error to false once the backlog is worked down.
      - name: Full report — HIGH and above (advisory)
        continue-on-error: true
        run: make security

  backend-test:
    name: Backend Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install backend dependencies
        run: make backend-install

      - name: Run unit tests + Tier 1
        run: make backend-ci

  backend-test-t4:
    name: Backend Tier 4 (ChromaDB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install backend dependencies
        run: make backend-install

      - name: Cache ChromaDB ONNX embedder
        uses: actions/cache@v6
        with:
          path: ~/.cache/chroma
          key: chroma-onnx-${{ runner.os }}

      - name: Run Tier 4 (ChromaDB)
        run: make backend-test-integration-t4

  backend-test-t2:
    name: Backend Tier 2 (MongoDB)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install backend dependencies
        run: make backend-install

      - name: Run Tier 2 (MongoDB)
        run: make backend-test-integration-t2

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Node 24 bundles npm 11, which package-lock.json requires (npm 10
          # rejects its optional-dep shape). Taking npm from the toolchain
          # avoids an unpinned `npm install -g npm@11` from the registry on
          # every run -- an install-scripted fetch in a token-bearing runner.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: make frontend-install

      - name: Dependency audit (npm audit, fail on critical)
        run: make frontend-audit

      - name: Run frontend CI checks
        run: make frontend-ci

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-static, backend-test, backend-test-t2, backend-test-t4, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Build release containers
        run: make docker-build

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.74.0

      # Scans the artifact a deploying campus actually pulls, base layers and
      # our dependencies together. Notably the only thing that sees the
      # Chromium apt tree that `playwright install --with-deps` bakes in.
      # Advisory until a baseline exists -- see the Makefile comment.
      - name: Scan published images (advisory)
        continue-on-error: true
        run: make security-built-images

  helm-lint:
    name: Helm Chart Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # helm is preinstalled on ubuntu-latest runners; kubeconform is not.
      # Pinned by version and checksum (this repo avoids unpinned fetches in
      # token-bearing runners).
      - name: Install kubeconform
        run: |
          curl -fsSL -o kubeconform.tgz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  kubeconform.tgz" | sha256sum -c -
          tar xzf kubeconform.tgz kubeconform
          sudo install kubeconform /usr/local/bin/kubeconform

      - name: Lint and validate the chart
        run: make helm-lint
