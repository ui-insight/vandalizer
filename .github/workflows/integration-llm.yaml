name: Integration (LLM)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 6am UTC

jobs:
  llm-tests:
    runs-on: ubuntu-latest
    # The ledger entry goes out as a PR below: `contents` to push the branch,
    # `pull-requests` to open it.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install backend dependencies
        run: make backend-install

      - name: Run LLM integration tests
        env:
          INTEGRATION_LLM_MODEL: ${{ secrets.INTEGRATION_LLM_MODEL }}
          INTEGRATION_LLM_API_KEY: ${{ secrets.INTEGRATION_LLM_API_KEY }}
          INTEGRATION_LLM_ENDPOINT: ${{ secrets.INTEGRATION_LLM_ENDPOINT }}
          INTEGRATION_LLM_PROTOCOL: ${{ secrets.INTEGRATION_LLM_PROTOCOL }}
        run: make backend-test-integration-t3

      # The κ-drift ledger is the point of running this weekly, and the runner
      # disk is thrown away when the job ends — so without persisting the entry
      # every run appended one line to nothing, `trailing_median` never reached
      # its three-entry minimum, and drift detection could never fire.
      #
      # It goes through a PR rather than a direct push. `main` requires six
      # status checks, and a commit pushed from here carries none of them
      # (`[skip ci]` guarantees they never run), so a direct push is rejected
      # with GH006 — the job would fail weekly and the ledger still would not
      # grow. A PR needs no bypass token and puts a human on a file that gates
      # a published quality number, which is the right amount of ceremony.
      #
      # Consequence worth stating plainly: the ledger only accumulates when
      # these PRs are merged. Left unmerged, drift detection stays inert.
      - name: Open a PR with the drift-ledger entry
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LEDGER=backend/tests/fixtures/judge_drift_history.jsonl
          if git diff --quiet -- "$LEDGER"; then
            echo "No new ledger entry to commit."
            exit 0
          fi
          BRANCH="judge-drift/${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "$LEDGER"
          git commit -m "chore(judge): record κ-drift ledger entry"
          git push origin "$BRANCH"
          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "$BRANCH" \
            --title "chore(judge): κ-drift ledger entry from run ${GITHUB_RUN_ID}" \
            --body "Weekly tier-3 calibration result, appended to the κ-drift ledger.

          Merging this is what lets \`trailing_median\` build a baseline — until
          three entries exist for a judge model, \`assert_no_regression\` returns
          silently and drift cannot be detected however far agreement moves."
