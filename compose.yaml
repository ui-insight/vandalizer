services:
  redis:
    image: redis/redis-stack:7.4.0-v3
    networks:
      - vandalizer
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7.0.16
    networks:
      - vandalizer
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  chromadb:
    image: chromadb/chroma:0.6.3
    networks:
      - vandalizer
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # Baked into /app/VERSION so the app self-reports its build.
        # setup.sh exports VERSION (git describe); defaults to "dev" otherwise.
        VERSION: ${VERSION:-dev}
        # Set INSTALL_BROWSER=false to build without headless Chromium (~1 GB,
        # 112 OS packages). Declared on both services that build this Dockerfile
        # so one setting cannot leave the api and celery images disagreeing
        # about whether a browser is there to launch. See DEPLOY.md.
        INSTALL_BROWSER: ${INSTALL_BROWSER:-true}
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      - REDIS_HOST=redis
      - MONGO_HOST=mongodb://mongo:27017/
      - CHROMADB_HOST=chromadb:8000
      - UPLOAD_DIR=/app/static/uploads
    networks:
      - vandalizer
    volumes:
      - uploads:/app/static/uploads
      # Model vocabularies, read-only. Token counting reads tokenizer.json —
      # not the weights, and not the GPU. Point HF_CACHE_PATH at your HF_HOME
      # if you self-host models; leaving it unset is fine, and the budget
      # falls back to estimating (and logs that it did).
      - ${HF_CACHE_PATH:-./hf-cache}:/hf-cache:ro
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4.0"

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # Baked into /app/VERSION so the app self-reports its build.
        # setup.sh exports VERSION (git describe); defaults to "dev" otherwise.
        VERSION: ${VERSION:-dev}
        # Set INSTALL_BROWSER=false to build without headless Chromium (~1 GB,
        # 112 OS packages). Declared on both services that build this Dockerfile
        # so one setting cannot leave the api and celery images disagreeing
        # about whether a browser is there to launch. See DEPLOY.md.
        INSTALL_BROWSER: ${INSTALL_BROWSER:-true}
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      - REDIS_HOST=redis
      - MONGO_HOST=mongodb://mongo:27017/
      - CHROMADB_HOST=chromadb:8000
      - UPLOAD_DIR=/app/static/uploads
    networks:
      - vandalizer
    volumes:
      - uploads:/app/static/uploads
      # Model vocabularies, read-only. Token counting reads tokenizer.json —
      # not the weights, and not the GPU. Point HF_CACHE_PATH at your HF_HOME
      # if you self-host models; leaving it unset is fine, and the budget
      # falls back to estimating (and logs that it did).
      - ${HF_CACHE_PATH:-./hf-cache}:/hf-cache:ro
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    entrypoint: ["sh", "run_celery.sh", "start"]
    # The backend image's HEALTHCHECK probes the API's HTTP endpoint, but this
    # container runs Celery workers and serves no HTTP — so without this
    # override it reports "unhealthy" on every install from the first probe
    # onward, and a genuinely dead worker is indistinguishable from a healthy
    # one. Ping the workers over the broker instead: exits 0 when they answer,
    # non-zero when they don't. start_period covers worker boot.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app.celery inspect ping -t 10 > /dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      start_period: 90s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 12G
          cpus: "4.0"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-}
        VITE_SENTRY_RELEASE: ${VITE_SENTRY_RELEASE:-}
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    networks:
      - vandalizer
    restart: unless-stopped

networks:
  vandalizer:
    driver: bridge

volumes:
  mongo-data:
    driver: local
  chroma-data:
    driver: local
  uploads:
    driver: local
