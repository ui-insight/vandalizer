{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vandalizer.fullname" . }}-redis
  labels:
    {{- include "vandalizer.labels" (dict "ctx" . "component" "redis") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
  selector:
    {{- include "vandalizer.selectorLabels" (dict "ctx" . "component" "redis") | nindent 4 }}
{{- end }}
