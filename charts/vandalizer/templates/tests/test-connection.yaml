apiVersion: v1
kind: Pod
metadata:
  name: {{ include "vandalizer.fullname" . }}-test-connection
  labels:
    {{- include "vandalizer.labels" (dict "ctx" . "component" "test") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: check-frontend
      image: docker.io/library/busybox:1.36
      command:
        - wget
        - -q
        - -O-
        - http://{{ include "vandalizer.fullname" . }}-frontend:{{ .Values.frontend.service.port }}/health
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
