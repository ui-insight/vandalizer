{{- if .Values.chromadb.enabled }}
{{/*
ChromaDB vector store. The image tag is pinned deliberately: the backend's
chromadb client speaks the v1 HTTP API; Chroma server >=1.0 is v2-only and
incompatible. Bump the client and server together.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vandalizer.fullname" . }}-chromadb
  labels:
    {{- include "vandalizer.labels" (dict "ctx" . "component" "chromadb") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "vandalizer.selectorLabels" (dict "ctx" . "component" "chromadb") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vandalizer.selectorLabels" (dict "ctx" . "component" "chromadb") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.chromadb.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: chromadb
          image: "{{ .Values.chromadb.image.repository }}:{{ .Values.chromadb.image.tag }}"
          imagePullPolicy: {{ .Values.chromadb.image.pullPolicy }}
          {{- with .Values.chromadb.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: IS_PERSISTENT
              value: "TRUE"
            - name: ANONYMIZED_TELEMETRY
              value: "FALSE"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/v1/heartbeat
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/v1/heartbeat
              port: http
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/v1/heartbeat
              port: http
            periodSeconds: 10
            failureThreshold: 3
          {{- with .Values.chromadb.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /chroma/chroma
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.chromadb.persistence.existingClaim | default (printf "%s-chromadb" (include "vandalizer.fullname" .)) }}
      {{- with .Values.chromadb.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.chromadb.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.chromadb.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
