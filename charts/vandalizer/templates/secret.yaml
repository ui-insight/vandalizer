{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vandalizer.fullname" . }}-backend
  labels:
    {{- include "vandalizer.labels" (dict "ctx" . "component" "config") | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET_KEY: {{ required "secrets.jwtSecretKey is required (or provide secrets.existingSecret)" .Values.secrets.jwtSecretKey | quote }}
  CONFIG_ENCRYPTION_KEY: {{ required "secrets.configEncryptionKey is required (or provide secrets.existingSecret) — and back it up: losing it makes credentials stored in MongoDB undecryptable" .Values.secrets.configEncryptionKey | quote }}
  {{- with .Values.secrets.smtpPassword }}
  SMTP_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.resendApiKey }}
  RESEND_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.sentryDsn }}
  SENTRY_DSN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.azure.clientId }}
  AZURE_CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.azure.clientSecret }}
  AZURE_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.azure.tenantId }}
  AZURE_TENANT_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.graph.tokenKey }}
  GRAPH_TOKEN_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.graph.clientStateSecret }}
  GRAPH_CLIENT_STATE_SECRET: {{ . | quote }}
  {{- end }}
{{- end }}
