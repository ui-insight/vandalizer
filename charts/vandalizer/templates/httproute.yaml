{{- if .Values.httpRoute.enabled }}
{{/*
Gateway API route. Like the Ingress, the default rule sends everything to the
frontend so its nginx handles SSE, body size, and the OAuth callback
uniformly across Gateway implementations. httpRoute.additionalRules entries
are rendered ahead of the catch-all — see values-split-routing.yaml for
routing /api directly to the api Service at the edge.
*/}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "vandalizer.fullname" . }}
  labels:
    {{- include "vandalizer.labels" (dict "ctx" . "component" "frontend") | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml (required "httpRoute.parentRefs is required when httpRoute.enabled=true" .Values.httpRoute.parentRefs) | nindent 4 }}
  {{- with include "vandalizer.httpRouteHostnames" . }}
  hostnames:
    {{- . | nindent 4 }}
  {{- end }}
  rules:
    {{- with .Values.httpRoute.additionalRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      {{- with .Values.httpRoute.timeouts }}
      # SSE streams are long-lived; "0s" disables the timeout (override with
      # a duration if the Gateway implementation rejects 0s).
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ include "vandalizer.fullname" . }}-frontend
          port: {{ .Values.frontend.service.port }}
{{- end }}
