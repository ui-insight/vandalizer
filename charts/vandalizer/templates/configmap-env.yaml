apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vandalizer.fullname" . }}-env
  labels:
    {{- include "vandalizer.labels" (dict "ctx" . "component" "config") | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  FRONTEND_URL: {{ include "vandalizer.frontendUrl" . | quote }}
  MONGO_HOST: {{ include "vandalizer.mongoUri" . | quote }}
  REDIS_HOST: {{ include "vandalizer.redisHost" . | quote }}
  # app/services/credentials_service.py reads the lowercase name from
  # os.environ directly (case-sensitive), unlike the pydantic Settings —
  # both spellings must be present.
  redis_host: {{ include "vandalizer.redisHost" . | quote }}
  CHROMADB_HOST: {{ include "vandalizer.chromaHost" . | quote }}
  UPLOAD_DIR: {{ .Values.config.uploadDir | quote }}
  WEB_WORKERS: {{ .Values.config.webWorkers | quote }}
  {{- range $key, $value := .Values.config.extraEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
