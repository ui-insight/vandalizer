{{- if .Values.metrics.serviceMonitor.enabled }}
{{/*
Requires the Prometheus Operator CRDs. Note /api/metrics is unauthenticated;
the chart's NetworkPolicy blocks scraping unless the Prometheus namespace is
admitted via networkPolicy.apiExtraIngressFrom.
*/}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "vandalizer.fullname" . }}-api
  labels:
    {{- include "vandalizer.labels" (dict "ctx" . "component" "api") | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "vandalizer.selectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  endpoints:
    - port: http
      path: /api/metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
