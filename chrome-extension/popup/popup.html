<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vandalizer Browser</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>Vandalizer Browser</h1>
    <p>Lets Vandalizer chat read the sites you allow, signed in as you. It never submits, saves or approves anything.</p>

    <form id="connect">
      <label for="origin">Vandalizer address</label>
      <input id="origin" type="url" placeholder="https://vandalizer.example.edu" required>
      <div class="row">
        <button class="primary" type="submit">Connect</button>
      </div>
      <div id="status" class="status" role="status"></div>
    </form>

    <h2>Sites chat may read</h2>
    <ul id="sites"></ul>
  </main>
  <script src="popup.js" type="module"></script>
</body>
</html>
